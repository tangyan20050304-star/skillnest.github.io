<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillNest - Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f7fa;padding:40px}
        .box{max-width:400px;margin:0 auto;background:white;padding:30px;border-radius:12px;box-shadow:0 0 10px #00000010}
        h2{text-align:center;color:#2c3e50;margin-bottom:20px}
        .input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:6px}
        .btn{width:100%;padding:12px;background:#3498db;color:white;border:none;border-radius:6px;margin-top:10px}
        .tip{text-align:center;margin-top:15px;color:#666}
    </style>
</head>
<body>
    <div class="box">
        <h2>SkillNest Login</h2>
        <input class="input" type="text" placeholder="Student ID / Username">
        <input class="input" type="password" placeholder="Password">
        <button class="btn">Login</button>
        <div class="tip">New user? <a href="register.html">Register now</a></div>
    </div>
</body>
</html>
